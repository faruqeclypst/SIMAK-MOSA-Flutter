<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistem Informasi Monitoring Akademik SMAN Modal Bangsa">
  <meta name="theme-color" content="#00AA13">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SIMAK MOSA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>SIMAK MOSA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAF9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.35s ease-out;
    }
    #loading-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      animation: splash-pulse 1.8s infinite ease-in-out;
    }
    .splash-title {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.5px;
    }
    .splash-sub {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #00820F;
      background: #E8F5E9;
      padding: 3px 12px;
      border-radius: 20px;
    }
    .splash-spinner {
      margin-top: 24px;
      width: 26px;
      height: 26px;
      border: 3px solid #E5E7EB;
      border-top-color: #00AA13;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img class="splash-logo" src="favicon.png?v=2" alt="SIMAK-MOSA Logo" />
    <div class="splash-title">SIMAK-MOSA</div>
    <div class="splash-sub">SMAN Modal Bangsa</div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('hide');
        setTimeout(function() { splash.remove(); }, 350);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
